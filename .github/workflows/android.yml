name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Release is built unsigned here: the upload key never leaves the maintainer's machine.
      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease lintRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apks
          path: |
            app/build/reports/lint-results-*.html
            app/build/outputs/apk/**/*.apk
